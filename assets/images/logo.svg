<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>

  <!-- Gym Icon / Shield / Dumbbell -->
  <g transform="translate(15, 15)">
    <!-- Hexagonal Crest -->
    <polygon points="45,5 85,25 85,65 45,85 5,65 5,25" fill="#18181b" stroke="url(#grad-accent)" stroke-width="3" />
    <!-- Stylized Dumbbell / Flame -->
    <path d="M28,32 L34,32 L34,58 L28,58 Z" fill="#ffffff" />
    <path d="M56,32 L62,32 L62,58 L56,58 Z" fill="#ffffff" />
    <rect x="34" y="42" width="22" height="6" fill="url(#grad-accent)" rx="3" />
    <!-- Central E Lightning Accent -->
    <path d="M45,22 L52,38 L43,38 L49,58 L36,44 L43,44 Z" fill="url(#grad-gold)" />
  </g>

  <!-- Typography -->
  <!-- EVOLUTION -->
  <text x="120" y="58" font-family="'Montserrat', 'Impact', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="3">
    EVOLUTION
  </text>
  <!-- FITNESS -->
  <text x="122" y="92" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="24" fill="url(#grad-accent)" letter-spacing="8">
    FITNESS
  </text>
  <!-- Sub-badge -->
  <text x="320" y="90" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#a1a1aa" letter-spacing="2">
    LOHEGAON • PUNE
  </text>
</svg>
